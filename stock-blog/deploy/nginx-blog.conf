# ============================================================
# 股市操练笔记 · Nginx 站点配置
# 适用：Ubuntu/Debian（Nginx 默认路径），CentOS/RHEL 请放到 /etc/nginx/conf.d/
# 用法：把本文件上传到服务器后，替换 server_name 为你的域名或服务器 IP，
#       然后执行：
#         sudo nginx -t          # 检查配置语法
#         sudo systemctl reload nginx
# ============================================================

server {
    # 监听 80 端口（HTTP）。绑定域名后建议再配 HTTPS，见文末注释
    listen 80;
    listen [::]:80;

    # 【必改】替换为你的域名（如 blog.example.com）或服务器公网 IP（如 1.2.3.4）
    server_name your-domain.com;

    # 站点根目录（与部署指南中的目录一致）
    root /var/www/stock-blog;
    index index.html;

    # 站点根目录（与部署指南中的目录一致）
    # 前端静态路由回退
    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源缓存（图片/CSS/JS，提升访问速度）
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?|eot|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # 开启 gzip 压缩（文本类内容体积可减小 60% 以上）
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/xml;

    # 禁止访问隐藏文件（如 .git、.htaccess）
    location ~ /\. {
        deny all;
    }
}

# ============================================================
# HTTPS 配置（可选，强烈建议）
# 方式一：安装 certbot 自动配置（推荐，免费证书）
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d your-domain.com
#   执行后会帮你自动改写本配置文件并配置自动续期。
