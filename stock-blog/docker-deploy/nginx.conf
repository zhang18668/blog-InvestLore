# 股市操练笔记 · Docker 内 Nginx 站点配置
server {
    listen 80;
    # 在容器内用 _ 匹配任意域名/IP，由外层（防火墙/反代）决定访问域名
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?|eot|ttf|map)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/xml;

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}

