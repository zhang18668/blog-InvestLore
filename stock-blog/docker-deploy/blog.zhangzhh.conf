# blog.zhangzhh13.xyz — 股市操练笔记（公开博客）
# 反向代理到 stock-blog 容器。容器端口由 publish-server 分配，当前为 32001。
# 重新部署后若端口变化，需同步更新下方 proxy_pass 端口。

server {
    listen 80;
    listen [::]:80;
    server_name blog.zhangzhh13.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name blog.zhangzhh13.xyz;

    ssl_certificate     /etc/letsencrypt/live/blog.zhangzhh13.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.zhangzhh13.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:32001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}